name: Governance Cadence

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run resolver in dry-run mode (do not close issues)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "20 14 1 * *"

concurrency:
  group: governance-cadence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 14 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify published CLI release metadata
        id: release_freshness
        continue-on-error: true
        run: pnpm governance:release:freshness

      - name: Verify published CLI behavior contract
        if: steps.release_freshness.outcome == 'success'
        continue-on-error: true
        run: pnpm governance:release:behavior

      - name: Upload release verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-release-verification
          path: |
            .tmp/governance/release-freshness.json
            .tmp/governance/release-behavior.json
          include-hidden-files: true
          if-no-files-found: warn

  monthly-claims-review:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '20 14 1 * *')
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute governance context
        id: governance
        run: |
          echo "period_key=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Download release verification artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: governance-release-verification
          path: .tmp/governance

      - name: Upsert monthly claims governance issue
        id: upsert_issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .tmp/governance
          ISSUE_KIND="claims-monthly" \
          PERIOD_KEY="${{ steps.governance.outputs.period_key }}" \
            node scripts/governance/upsert-review-issue.mjs | tee \
            ".tmp/governance/upsert-claims-monthly-${{ steps.governance.outputs.period_key }}.json"

      - name: Evaluate monthly claims governance result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/governance/evaluate-claims-monthly.mjs \
            --period-key "${{ steps.governance.outputs.period_key }}" \
            --freshness-benchmark-days 14 \
            --freshness-pricing-days 45 \
            --output ".tmp/governance/claims-monthly-${{ steps.governance.outputs.period_key }}.json"

      - name: Resolve monthly claims governance issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_KIND: claims-monthly
          ISSUE_NUMBER: ${{ steps.upsert_issue.outputs.issue_number }}
          PERIOD_KEY: ${{ steps.governance.outputs.period_key }}
          EVALUATION_JSON_PATH: .tmp/governance/claims-monthly-${{ steps.governance.outputs.period_key }}.json
          RUN_URL: ${{ steps.governance.outputs.run_url }}
        run: |
          dry_flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_flag="--dry-run"
          fi

          node scripts/governance/resolve-review-issue.mjs $dry_flag | tee \
            ".tmp/governance/resolve-claims-monthly-${{ steps.governance.outputs.period_key }}.json"

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-monthly-artifacts
          path: |
            .tmp/governance/upsert-claims-monthly-${{ steps.governance.outputs.period_key }}.json
            .tmp/governance/claims-monthly-${{ steps.governance.outputs.period_key }}.json
            .tmp/governance/resolve-claims-monthly-${{ steps.governance.outputs.period_key }}.json
            .tmp/governance/release-freshness.json
            .tmp/governance/release-behavior.json
          include-hidden-files: true
          if-no-files-found: warn
